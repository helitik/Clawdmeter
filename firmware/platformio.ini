; Shared base for both boards
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
framework = arduino
upload_speed = 921600
monitor_speed = 115200

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    ; NimBLE config — peripheral-only, single connection
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    ; LVGL config via build flags
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    -DLV_USE_LOG=0
    -DLV_USE_BAR=1
    -DLV_USE_LABEL=1
    -DLV_USE_ARC=1
    -DLV_USE_BTN=1
    -DLV_USE_LINE=1
    -DLV_USE_OBJ=1
    -DLV_USE_IMG=1
    -DLV_USE_IMAGE=1
    -DLV_USE_ANIMIMG=0
    -DLV_TICK_CUSTOM=1
    -DLV_USE_SNAPSHOT=1
    ; Built-in Montserrat sizes — used by the tdisplay UI and as fallback
    ; for the shared splash placeholder.
    -DLV_FONT_MONTSERRAT_12=1
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_48=1
    ; LVGL's lv_conf_internal.h sets LV_FONT_DEFAULT to &lv_font_montserrat_14
    ; automatically when that font is enabled — so we don't need to override
    ; it via -D (and can't: the `&` gets eaten by the shell that invokes gcc).

lib_deps =
    moononournation/GFX Library for Arduino@^1.5.6
    lvgl/lvgl@^9.2.0
    bblanchon/ArduinoJson@^7.0.0
    h2zero/NimBLE-Arduino@^2.1.1

; Waveshare ESP32-S3-Touch-AMOLED-2.16 (CO5300 480×480 QSPI + AXP2101 + QMI8658 + CST9220)
[env:waveshare_amoled_216]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_src_filter = +<*> -<boards/tdisplay/>
build_flags =
    ${env.build_flags}
    -I${PROJECT_DIR}/src/boards/amoled
    ; AXP2101 PMU
    -DXPOWERS_CHIP_AXP2101
lib_deps =
    ${env.lib_deps}
    lewisxhe/SensorLib@^0.2.6
    lewisxhe/XPowersLib@^0.2.7

; LilyGO T-Display S3 (ST7789 320×170 i80 8-bit parallel, 2 buttons, ADC battery)
[env:tdisplay_s3]
board = lilygo-t-display-s3
board_build.arduino.memory_type = qio_opi
build_src_filter = +<*> -<boards/amoled/>
build_flags =
    ${env.build_flags}
    -I${PROJECT_DIR}/src/boards/tdisplay
    -DBOARD_TDISPLAY_S3
    ; 8× upscale of the 20×20 pixel-art grid → 160×160 splash canvas,
    ; centered in the 320×170 screen.
    -DSPLASH_CELL=8
    ; Title-bar battery indicator is opt-in on tdisplay_s3 — T-Display S3
    ; has no charge-status pin and the ADC reading is misleading when the
    ; board is USB-powered without a LiPo attached. Add this define to
    ; show it anyway:
    ;     -DSHOW_BATTERY_ICON=1
